name: Collect Bandcamp sales

# WHY THIS RUNS THE WAY IT DOES
#
# Bandcamp's sales feed only holds the most recent 10 minutes. Anything we do not
# collect inside that window is gone permanently -- there is no archive to catch up
# from.
#
# We originally asked GitHub to start a run every 5 minutes. In practice GitHub
# coalesced that down to roughly one run every 34 minutes, so we were seeing about
# 10 minutes in every 34 and capturing only ~25% of all sales.
#
# So each run STAYS ALIVE and polls every 4 minutes rather than checking once. That
# part works exactly as intended.
#
# What did NOT work was assuming a queued run starts the moment the previous one ends.
# Measured over a full day: each run collected for its full 48 minutes, then sat idle
# for 53 MINUTES before GitHub started a successor -- a duty cycle of only 48%.
#
# Since that handoff costs ~53 minutes no matter what, the answer is to pay it as
# rarely as possible. Each run now polls for 5h50m, just under GitHub's 6-hour limit
# for a single job, which lifts the duty cycle from ~48% to roughly 87%.
#
# To close the remaining gap, each run asks the API to start its successor the moment
# it finishes, instead of waiting for GitHub's throttled schedule. GitHub blocks the
# built-in GITHUB_TOKEN from doing this (workflows may not recursively trigger
# themselves), so it uses a personal access token stored as the repository secret
# SELF_DISPATCH_TOKEN.
#
# If that secret is missing, expired, or revoked, nothing breaks: the run simply says
# so in its log and the 5-minute schedule continues as the fallback. Coverage drops
# back to ~87% rather than stopping.
#
# This is free either way: GitHub Actions is unlimited for public repositories.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write            # needed to commit the updated log back to the repo

# One run at a time, with one allowed to queue behind it. That queued run is what
# gives us continuous coverage, so cancel-in-progress must stay false.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 358     # just under GitHub's 6-hour ceiling for a single job

    env:
      RUN_SECONDS: 21000     # keep polling for 5h50m (see note above)
      POLL_SECONDS: 240      # every 4 minutes, well inside the feed's 10-minute window

    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The scripts use only Python's standard library, so there is nothing to
      # install -- which also means there are no dependencies to break.
      - name: Collect continuously, saving as we go
        env:
          # Empty string when the secret has not been added -- handled gracefully below.
          SELF_DISPATCH_TOKEN: ${{ secrets.SELF_DISPATCH_TOKEN }}
        run: |
          set -uo pipefail
          git config user.name  "bandcamp-tracker-bot"
          git config user.email "actions@github.com"

          save () {
            git add -A data state.json dashboard.html 2>/dev/null || true
            if git diff --cached --quiet; then
              return 0                      # nothing new this cycle
            fi
            git commit -q -m "data: collected $(date -u '+%Y-%m-%d %H:%M UTC')" || return 0
            # A queued run may have pushed while we worked. Rebase and retry rather
            # than failing, so a busy moment never costs us a commit.
            for attempt in 1 2 3 4 5; do
              if git push -q; then
                return 0
              fi
              echo "Push rejected (attempt $attempt); rebasing onto latest..."
              git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" || true
              sleep $((attempt * 3))
            done
            echo "WARNING: could not push this cycle; the next cycle will retry." >&2
          }

          END=$(( $(date +%s) + RUN_SECONDS ))
          cycle=0

          while [ "$(date +%s)" -lt "$END" ]; do
            cycle=$((cycle + 1))
            echo "--- cycle $cycle at $(date -u '+%H:%M:%S UTC') ---"

            # A failed poll must never end the run; the next cycle is only 4 minutes
            # away and the feed still holds 10 minutes, so we can recover from it.
            python collect.py || echo "collect.py failed this cycle; continuing."
            save

            REMAIN=$(( END - $(date +%s) ))
            if [ "$REMAIN" -le 0 ]; then break; fi
            if [ "$REMAIN" -lt "$POLL_SECONDS" ]; then sleep "$REMAIN"; else sleep "$POLL_SECONDS"; fi
          done

          # Ask for the successor BEFORE the wrap-up work, so it is already queued and
          # starts the instant this run exits rather than waiting on the schedule.
          if [ -n "${SELF_DISPATCH_TOKEN:-}" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer ${SELF_DISPATCH_TOKEN}"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/collect.yml/dispatches"               -d "{\"ref\":\"${GITHUB_REF_NAME}\"}")
            case "$code" in
              204) echo "Successor run requested." ;;
              401|403) echo "SELF_DISPATCH_TOKEN rejected (HTTP $code) - check it has Actions: Read and write, and has not expired. Falling back to the schedule." >&2 ;;
              *)   echo "Successor request failed (HTTP $code). Falling back to the schedule." >&2 ;;
            esac
          else
            echo "No SELF_DISPATCH_TOKEN set; relying on the 5-minute schedule (~87% coverage)."
          fi

          echo "--- rebuilding dashboard ---"
          python dashboard.py || echo "dashboard build failed; data is still safe."
          save

          echo "Finished $cycle collection cycles."
