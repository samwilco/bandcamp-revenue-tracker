name: Collect Bandcamp sales

# Runs every 5 minutes. This is deliberate, not excessive: Bandcamp's sales feed
# only ever returns the most recent 10 minutes of activity, so anything slower
# than that permanently loses sales. Hourly would miss roughly 83% of them.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write            # needed to commit the updated log back to the repo

# Never let two runs write to the repo at the same time -- that would cause
# push conflicts. A queued run waits for the one in front of it.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The script uses only Python's standard library, so there is nothing
      # to install -- which also means there are no dependencies to break.
      - name: Collect sales and banner
        id: collect
        run: python collect.py

      - name: Rebuild the dashboard
        if: always()      # a fresh dashboard is useful even if collection stumbled
        run: python dashboard.py

      - name: Commit and push the updated log
        if: always()          # still save partial results even if collection failed
        run: |
          set -euo pipefail
          git config user.name  "bandcamp-tracker-bot"
          git config user.email "actions@github.com"

          git add -A data state.json dashboard.html

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "data: collected $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Another run may have pushed while we were working. Rebase onto it and
          # retry rather than failing, so a busy moment never costs us a commit.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto latest and retrying..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 3))
          done

          echo "Could not push after 5 attempts." >&2
          exit 1
